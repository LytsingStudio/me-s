[package]
name = "me-s"
version = "0.1.56"
edition = "2024"
autobins = false
description = "A lightweight local agent runtime optimized for long-running work"
license = "MIT"
readme = "README.md"
repository = "https://github.com/LytsingStudio/me-s"

[lib]
name = "me"
path = "src/lib.rs"

[[bin]]
name = "me-s"
path = "src/main.rs"

[[bin]]
name = "me-gateway"
path = "src/gateway_main.rs"

[dependencies]
argon2 = "0.5.3"
base64 = "0.22.1"
blake3 = "1.8.5"
chardetng = "1.0.0"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
crossterm = "0.29.0"
crc32fast = "1.5.0"
flate2 = "1.1.9"
fs2 = "0.4.3"
getrandom = "0.4.3"
encoding_rs = "0.8.35"
globset = "0.4.18"
grep-matcher = "0.1.8"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
image = { version = "0.25.8", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tiff", "webp"] }
ignore = "0.4.33"
libc = "0.2.189"
os_info = { version = "3.15.0", default-features = false }
portable-pty = "0.9.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "form", "json", "rustls", "socks", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
signal-hook = "0.3.18"
tar = "0.4"
tiktoken-rs = "0.12.0"
tiny_http = "0.12.0"
toml = "1.1.3"
two-face = { version = "0.5.1", default-features = false, features = ["syntect-onig"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
vt100 = "0.16.2"
zstd = "0.13.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[build-dependencies]
sha2 = "0.10.9"
