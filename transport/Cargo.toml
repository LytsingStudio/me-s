[package]
name = "me-transport"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
blocking = ["dep:reqwest", "reqwest/blocking"]
async = ["dep:reqwest", "dep:tokio"]

[dependencies]
snow = { version = "=0.10.0", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-sha2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4.3"
reqwest = { version = "0.13.4", default-features = false, optional = true }
tokio = { version = "1.53", features = ["sync"], optional = true }

[profile.release]
opt-level = "s"
lto = true
strip = true
