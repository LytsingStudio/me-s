<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      pointer-events: none;
    }
    .window-shadow {
      position: absolute;
      inset: 48px;
      border-radius: 18px;
      background: rgb(0 0 0 / 1.5%);
      box-shadow: 0 18px 34px rgb(0 0 0 / 42%), 0 5px 14px rgb(0 0 0 / 28%);
    }
  </style>
</head>
<body><div class="window-shadow"></div></body>
</html>
