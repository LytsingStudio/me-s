<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark light">
  <title>ME</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/katex.css">
  <link rel="stylesheet" href="/xterm.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/theme.css">
</head>
<body>
  <main id="login-screen" class="login-screen hidden">
    <form id="login-form" class="login-card">
      <div class="login-brand"><div class="brand-mark">ME</div><div><strong>ME</strong></div></div>
      <h1>登录</h1>
      <p>请输入访问密码。</p>
      <label for="login-password">密码</label>
      <input id="login-password" type="password" autocomplete="current-password" autofocus required>
      <div id="login-error" class="login-error" aria-live="polite"></div>
      <button id="login-submit" class="primary-button" type="submit">登录</button>
    </form>
  </main>

  <div id="app" class="app-shell hidden">
    <aside class="sidebar">
      <div class="sidebar-scroll">
        <section class="sidebar-section workspace-section">
          <div class="sidebar-heading workspace-heading">
            <span>工作</span>
            <span class="heading-actions"><button id="create-workspace" type="button" title="新建工作区">新建</button><button id="open-workspace" type="button" title="打开工作区">打开</button></span>
          </div>
          <nav id="workspace-list" class="workspace-list"></nav>
        </section>
        <div class="sidebar-divider" aria-hidden="true"></div>
        <section class="sidebar-section chat-section">
          <div class="sidebar-heading chat-heading"><span>聊天</span><button id="add-agent" type="button" title="新建聊天" aria-label="新建聊天">＋</button></div>
          <nav id="agent-list" class="agent-list chat-agent-list"></nav>
        </section>
      </div>
      <footer class="sidebar-footer">
        <button id="open-settings" class="sidebar-settings" type="button" title="设置" aria-label="设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.86 2.86-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.86-2.86.06-.06A1.7 1.7 0 0 0 4.2 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H2v-4h.5A1.7 1.7 0 0 0 4.2 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06L6.66 4.2l.06.06A1.7 1.7 0 0 0 8.6 4.6a1.7 1.7 0 0 0 1-.6A1.7 1.7 0 0 0 10 2.9V3h4v-.1A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.86 2.86-.06.06A1.7 1.7 0 0 0 19.4 9c.16.4.37.75.6 1 .3.3.68.5 1.1.6h.4v4h-.4a1.7 1.7 0 0 0-1.7.4Z"/></svg></button>
        <span id="environment-footer">WebUI</span>
        <div class="sidebar-appearance" role="group" aria-label="外观设置">
          <button id="theme-cycle" class="theme-control theme-cycle" type="button" title="切换主题" aria-label="切换主题">
            <svg class="theme-icon theme-icon-shirt" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4 6 5 3 8l2.5 3L7 9.8V20h10V9.8l1.5 1.2L21 8l-3-3-2.5-1A4 4 0 0 1 12 6a4 4 0 0 1-3.5-2Z"/></svg>
          </button>
          <button id="theme-mode" class="theme-control theme-mode" type="button" title="切换明暗模式" aria-label="切换明暗模式">
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.4A8.4 8.4 0 0 1 8.6 3.8a8.5 8.5 0 1 0 11.6 11.6Z"/></svg>
          </button>
        </div>
      </footer>
    </aside>
    <button id="mobile-sidebar-backdrop" class="mobile-sidebar-backdrop" type="button" aria-label="关闭会话列表"></button>

    <main class="workspace">
      <nav id="view-tabs" class="view-tabs">
        <button id="mobile-sidebar-toggle" class="mobile-sidebar-toggle" type="button" aria-label="打开会话列表" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <button data-view="chat" class="active">聊天</button>
        <button data-view="workmap">工作图</button>
        <button data-view="files">文件</button>
        <button data-view="session-terminal">终端</button>
        <button data-view="remote-control">远程控制</button>
        <span id="terminal-tabs"></span>
      </nav>

      <section id="chat-view" class="view active">
        <div id="transcript" class="transcript">
          <div id="transcript-content" class="transcript-content"></div>
        </div>
        <div class="scroll-to-bottom-anchor">
          <button id="scroll-to-bottom" class="scroll-to-bottom hidden" type="button" aria-label="滚动到最新消息" title="滚动到最新消息">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>
        <div id="objective-summary" class="objective-summary hidden"></div>
        <div id="composer-shell" class="composer-shell">
          <div class="prompt-input-stack">
            <textarea id="prompt-input" rows="1" placeholder="发送消息"></textarea>
            <textarea id="prompt-input-mirror" class="prompt-input-mirror" rows="1" tabindex="-1" readonly aria-hidden="true"></textarea>
          </div>
          <div class="composer-actions">
            <span id="input-hint">Enter 换行 · Shift/Alt+Enter 发送 · Esc 中止/撤回/清空</span>
            <div class="composer-buttons">
              <button id="stop-generation" class="composer-button stop-button" type="button" disabled>停止</button>
              <button id="send-prompt" class="primary-button composer-button" type="button"><span id="send-prompt-spinner" class="send-prompt-spinner hidden" aria-hidden="true"></span><span id="send-prompt-label">发送</span></button>
            </div>
          </div>
        </div>
      </section>

      <section id="workmap-view" class="view">
        <div class="view-toolbar">
          <div><strong>工作图</strong><span id="workmap-count"></span></div>
        </div>
        <div id="workmap-content" class="document-view"></div>
      </section>

      <section id="files-view" class="view file-manager-view" aria-label="文件">
        <div id="file-manager" class="file-manager"></div>
      </section>

      <section id="session-terminal-view" class="view session-terminal-view" aria-label="终端">
        <div id="session-terminal-screen" class="session-terminal-screen"></div>
        <div id="session-terminal-controls" class="session-terminal-controls" aria-label="终端快捷键">
          <div class="session-terminal-control-strip">
            <button type="button" data-session-terminal-byte="1b" aria-label="发送 Escape" disabled>ESC</button>
            <button type="button" data-session-terminal-byte="01" aria-label="发送 Ctrl+A" disabled>^A</button>
            <button type="button" data-session-terminal-byte="1a" aria-label="发送 Ctrl+Z" disabled>^Z</button>
            <button type="button" data-session-terminal-byte="18" aria-label="发送 Ctrl+X" disabled>^X</button>
            <button type="button" data-session-terminal-byte="03" aria-label="发送 Ctrl+C" disabled>^C</button>
            <button type="button" data-session-terminal-byte="16" aria-label="发送 Ctrl+V" disabled>^V</button>
            <button type="button" data-session-terminal-byte="13" aria-label="发送 Ctrl+S" disabled>^S</button>
            <button type="button" data-session-terminal-byte="04" aria-label="发送 Ctrl+D" disabled>^D</button>
            <button type="button" data-session-terminal-byte="0f" aria-label="发送 Ctrl+O" disabled>^O</button>
            <button type="button" data-session-terminal-byte="10" aria-label="发送 Ctrl+P" disabled>^P</button>
            <button type="button" data-session-terminal-byte="11" aria-label="发送 Ctrl+Q" disabled>^Q</button>
            <button type="button" data-session-terminal-byte="0d" aria-label="发送 Enter" disabled>Enter</button>
          </div>
        </div>
      </section>

      <section id="remote-control-view" class="view remote-control-view" aria-label="远程控制">
        <div id="remote-control" class="remote-control">
          <div class="remote-control-toolbar">
            <button type="button" data-remote-start>开始</button>
            <button type="button" data-remote-stop disabled>停止</button>
            <button type="button" data-remote-screenshot>截屏</button>
            <label>帧率：<select data-remote-fps>
              <option value="1">1 FPS</option>
              <option value="3" selected>3 FPS</option>
              <option value="5">5 FPS</option>
              <option value="10">10 FPS</option>
            </select></label>
            <label>清晰度：<select data-remote-scale>
              <option value="100">100%</option>
              <option value="75">75%</option>
              <option value="50" selected>50%</option>
              <option value="25">25%</option>
            </select></label>
          </div>
          <div class="remote-control-stage" data-remote-stage>
            <img data-remote-image alt="宿主机主屏幕" draggable="false" hidden>
            <div class="remote-control-empty" data-remote-empty>点击“截屏”获取一帧，或点击“开始”进行远程控制。</div>
            <textarea class="remote-control-keyboard" data-remote-keyboard aria-label="远程键盘输入" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
          </div>
          <div class="remote-control-statusbar">
            <span data-remote-frame-count>frame: 0</span>
            <span data-remote-status data-state="pending">正在检查远程控制状态</span>
            <span class="remote-control-release-hint">Ctrl+Shift+E 释放键鼠</span>
          </div>
        </div>
      </section>

      <section id="terminal-view" class="view terminal-view">
        <div id="terminal-message" class="terminal-message hidden"></div>
        <div id="terminal-screen" class="terminal-screen"></div>
      </section>

      <footer id="statusbar" class="statusbar">
        <span class="status-primary">
          <span id="api-spinner"></span>
          <button id="status-model-trigger" class="status-selector status-model-selector" type="button" aria-haspopup="dialog" title="切换模型"><svg class="status-model-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 7.5 4.25v9.5L12 21l-7.5-4.25v-9.5L12 3Z"/><path d="m4.8 7.45 7.2 4.05 7.2-4.05M12 11.5V21"/></svg><span id="status-model">—</span></button>
          <button id="status-effort-trigger" class="status-selector status-effort" type="button" aria-haspopup="dialog" title="切换推理强度"><span id="status-effort">—</span></button>
          <span id="status-live-tokens" class="status-live-tokens"></span>
        </span>
        <button id="status-context-trigger" class="status-selector status-context-selector" type="button" aria-haspopup="dialog" aria-expanded="false" title="查看上下文用量"><span id="status-context">—/—</span></button>
      </footer>
    </main>
  </div>

  <div id="connection-overlay" class="connection-overlay hidden" role="alertdialog" aria-modal="true" aria-labelledby="connection-overlay-title">
    <div class="connection-card">
      <span class="connection-spinner" aria-hidden="true"></span>
      <h2 id="connection-overlay-title">正在重新连接</h2>
      <p id="connection-overlay-message">连接已断开，正在恢复当前界面。</p>
      <div id="event-recovery-progress" class="event-recovery-progress hidden" role="progressbar" aria-label="会话恢复进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="event-recovery-progress-track" aria-hidden="true"><span id="event-recovery-progress-fill" class="event-recovery-progress-fill"></span></div>
        <span id="event-recovery-progress-label" class="event-recovery-progress-label">0%</span>
      </div>
      <button id="connection-retry" class="primary-button" type="button">立即重试</button>
    </div>
  </div>

  <div id="user-message-menu" class="user-message-menu hidden" role="menu">
    <button id="copy-user-message" type="button" role="menuitem">复制</button>
    <button id="rewind-user-message" class="danger" type="button" role="menuitem">撤回</button>
    <button id="delete-user-turn" class="danger" type="button" role="menuitem">删除轮</button>
  </div>

  <div id="agent-menu" class="agent-menu hidden" role="menu">
    <button id="delete-agent-menu" class="danger" type="button" role="menuitem">删除会话</button>
  </div>

  <div id="workspace-menu" class="agent-menu hidden" role="menu">
    <button id="close-workspace-menu" class="danger" type="button" role="menuitem">关闭工作区</button>
  </div>

  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal" role="dialog" aria-modal="true">
      <header><h2 id="modal-title"></h2><button id="modal-close" aria-label="关闭">×</button></header>
      <p id="modal-description"></p>
      <div id="modal-content" class="modal-content"></div>
      <footer><button id="modal-cancel" class="ghost-button">取消</button><button id="modal-confirm" class="primary-button">确认</button></footer>
    </div>
  </div>

  <div id="choice-drawer-backdrop" class="drawer-backdrop hidden">
    <section class="choice-drawer" role="dialog" aria-modal="true" aria-labelledby="choice-drawer-title">
      <header><h2 id="choice-drawer-title"></h2><button id="choice-drawer-close" type="button" aria-label="关闭">×</button></header>
      <p id="choice-drawer-description"></p>
      <div id="choice-drawer-content" class="drawer-content"></div>
    </section>
  </div>

  <div id="context-drawer-backdrop" class="drawer-backdrop hidden">
    <section class="choice-drawer context-drawer" role="dialog" aria-modal="true" aria-labelledby="context-drawer-title">
      <header><h2 id="context-drawer-title">上下文用量</h2><button id="context-drawer-close" type="button" aria-label="关闭">×</button></header>
      <div class="context-drawer-content">
        <div class="context-ring-wrap">
          <svg id="context-ring" class="context-ring" viewBox="0 0 180 180" role="img" aria-label="上下文分类用量环形图"></svg>
          <strong id="context-percent" class="context-percent">—</strong>
        </div>
        <div id="context-usage-text" class="context-usage-text">— / —</div>
        <div id="context-breakdown" class="context-breakdown"></div>
      </div>
      <footer><button id="context-clear" class="ghost-button danger context-clear" type="button">清空上下文</button></footer>
    </section>
  </div>

  <div id="compact-summary-backdrop" class="modal-backdrop hidden">
    <section class="modal compact-summary-modal" role="dialog" aria-modal="true" aria-labelledby="compact-summary-title">
      <header><h2 id="compact-summary-title">上下文压缩</h2><button id="compact-summary-close" type="button" aria-label="关闭">×</button></header>
      <div id="compact-summary-content" class="modal-content markdown compact-summary-content"></div>
    </section>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script src="/markdown-it.js"></script>
  <script src="/katex.js"></script>
  <script src="/markdown.js"></script>
  <script src="/transcript.js"></script>
  <script src="/tool-presenters.js"></script>
  <script src="/edb-cache.js"></script>
  <script src="/xterm.js"></script>
  <script src="/xterm-addon-fit.js"></script>
  <script src="/xterm-addon-unicode11.js"></script>
  <script src="/file-manager.js"></script>
  <script src="/session-terminal.js"></script>
  <script src="/remote-control.js"></script>
  <script src="/app.js"></script>
</body>
</html>
